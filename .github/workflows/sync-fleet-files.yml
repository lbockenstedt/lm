name: Sync fleet files

# lm owns ONE copy of the fleet rules, the fleet agents and the skills
# (twins.json "fleet"). Tools only read them from the repo they work in, so on
# every lm dev change to them this pushes identical copies to each fleet repo's
# dev, and writes the rules into every AGENTS.md (lm's own included) between
# the fleet-rules markers. Edit them here, never in a spoke: a spoke's copy is
# overwritten on the next sync (check_twins warns about the drift until then).
# See docs/agents-and-skills.md.

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/fleet-rules.md'
      - '.claude/skills/**'
      - '.github/agents/**'
      - '.github/twins.json'
  workflow_dispatch:

concurrency:
  group: sync-fleet-files
  cancel-in-progress: false

permissions:
  # Write: lm's own AGENTS.md block is committed back with GITHUB_TOKEN (which
  # starts no workflow, so this can't loop).
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: lm
      - name: Clone every fleet repo's dev
        env:
          # Pushing to other repos needs a token with repo scope on them.
          TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          set -u
          repos=$(python3 -c "import json;print(' '.join(json.load(open('lm/.github/twins.json'))['fleet']['repos']))")
          mkdir -p fleet
          # lm itself: only its AGENTS.md block can change.
          ln -s ../lm fleet/lm
          for r in $repos; do
            git clone -q --depth 1 -b dev "https://x-access-token:${TOKEN}@github.com/lbockenstedt/$r.git" "fleet/$r" \
              || echo "::warning title=sync::could not clone $r"
          done
      - name: Copy the fleet files
        run: python3 lm/.github/scripts/sync_fleet_files.py --src lm --dest-root fleet | tee sync.txt
      - name: Commit and push each changed repo
        env:
          SRC_SHA: ${{ github.sha }}
        run: |
          set -u
          failed=""
          for r in $(sed -n 's/^changed \([^:]*\):.*/\1/p' sync.txt); do
            cd "fleet/$r"
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add -A .github .claude AGENTS.md
            git commit -q -m "Sync fleet rules, agents and skills from lm@${SRC_SHA:0:8}" \
              -m "Generated by lm sync-fleet-files.yml; edit lm/.github/fleet-rules.md, lm/.github/agents/ or lm/.claude/skills/, not this copy."
            # dev may have moved since the clone; rebase once and retry.
            git push -q origin HEAD:dev || { git pull -q --rebase origin dev && git push -q origin HEAD:dev; } || failed="$failed $r"
            echo "- $r" >> "$GITHUB_STEP_SUMMARY"
            cd - >/dev/null
          done
          if [ -n "$failed" ]; then echo "::error title=sync::push failed for:$failed"; exit 1; fi
