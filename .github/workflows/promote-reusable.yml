name: promote (reusable)

# Promotion pipeline: dev -> qa -> main.
#
# Pushing to dev prepares a PR into qa; landing on qa prepares a PR into main.
# The PR is raised against a prepared `promote/<src>-to-<tgt>` branch rather
# than against `dev`/`qa` directly, for two reasons:
#
#   1. VERSION is BRANCH-OWNED. Each branch advances its own counter (see
#      version-bump.yml). A straight merge would drag the source branch's
#      VERSION into the target -- so if someone set dev to 10.00, qa would
#      inherit it instead of going 1.45 -> 1.46. This job pins every tracked
#      VERSION file back to the target's value, so no version set on the
#      SOURCE can ever cross the boundary: promotion carries CODE ONLY.
#
#      READ THIS BEFORE FLAGGING A VERSION BUMP IN A PROMOTION DIFF. "Code
#      only" means no SOURCE version crosses -- it does NOT mean the diff
#      leaves VERSION untouched. The job then advances the TARGET's own
#      counter by exactly one step inside the promotion commit (see
#      .github/scripts/promote.sh, "Advance the TARGET's own version"),
#      because qa and main require a PR and a bot cannot push a bump straight
#      at them. A correct promotion diff therefore shows the target's own
#      sequence moving forward one step -- 1.35 -> 1.36, never dev's value.
#   2. Pinning VERSION here also RESOLVES what would otherwise be a recurring
#      merge conflict on that file, which would stall every promotion PR.
#
# Any OTHER conflict is left unresolved on purpose: the job fails loudly so a
# human resolves it, rather than a bot guessing at real code.
#
# REUSABLE. This is the single fleet copy of promote.yml's logic. Each repo
# keeps a thin `.github/workflows/promote.yml` that owns the TRIGGERS and the
# token `permissions`, and passes `WORKFLOW_TOKEN` to this (template:
# .github/workflow-templates-fleet/promote.yml). It used to be 17 hand-synced
# copies that an automated fixer patched independently until no two matched;
# every genuine fix from those copies is folded in here. In a called workflow
# `github.event_name`, `github.ref_name`, `github.repository` and the
# checked-out repo are all the CALLER's, so the trigger routing below behaves
# exactly as it did inline.
#
# PROMOTION IS DELIBERATE, NOT AUTOMATIC. This previously ran `on: push` to dev
# and qa, so every single commit to dev immediately raised (or force-pushed) a
# PR into qa, and merging that PR was itself a push to qa, which immediately
# raised the next PR into main. Unfinished work was therefore permanently in
# flight toward production and neither gate ever batched anything. Promotion is
# now started by hand: run the caller with `source: dev` when dev is actually
# ready, then again with `source: qa` to move qa into main.
#
# ONE ORIGINAL PR PER PROMOTION PR. Batching the CADENCE is right; batching the
# CONTENT was not. A single promotion PR used to carry everything that had
# accumulated on dev -- a 22-file diff spanning unrelated work -- and that broke
# the only thing promotion exists for, which is review. The skeptical-review
# panel measurably ran out of its per-review file budget on these PRs and
# rejected them for "could not verify X" rather than for any real defect.
# So `promote.sh` runs with PROMOTE_SPLIT=1: it cuts the promotion back to the
# original units of work (dev's first-parent commits -- one per merged PR, one
# per direct push) and promotes the OLDEST un-promoted one, by merging an
# ancestor of dev rather than by cherry-picking. See promote.sh.
#
# Promotion is driven up to three ways (whichever the caller subscribes to),
# and ALL of them only ever OPEN a PR:
#   * BY HAND (`workflow_dispatch` on the caller): `source: dev` (dev -> qa) or
#     `source: qa` (qa -> main) prepares that hop immediately.
#   * WHEN qa ADVANCES (`on: push: branches: [qa]` on the caller): landing a
#     promotion into qa means the dev -> qa unit in flight is done, so prepare
#     the NEXT one. Without this the queue stalls after unit 1 and every later
#     unit needs its own manual dispatch. This does NOT reintroduce the
#     per-commit cascade: the route is pinned to the dev -> qa hop ONLY, a push
#     to any branch other than qa is refused in `plan`, and nothing about it
#     moves code toward main. It is self-terminating -- preparing a PR is not a
#     push, so it fires again only when someone merges the PR it prepared.
#   * On a SCHEDULE (optional `on.schedule` on the caller; ab uses one): a
#     scheduled run has no inputs, so `plan` fans it out to BOTH normal hops.
#     A cadence, not a per-commit trigger, and it never merges.
# When there is nothing new to promote, promote.sh no-ops and no PR is opened.
#
# CI is unaffected -- ci.yml still runs on every dev push and on every PR, so
# day-to-day feedback stays automatic. Only the decision to MERGE is manual.
#
# THIS WORKFLOW NEVER MERGES. Every route ends at an OPEN PR that a human
# merges. That includes the dev -> main override below.
#
# ROUTES (allowlisted in `plan`):
#   dev -> qa     normal    (source: dev)                  -- the default
#   qa  -> main   normal    (source: qa)
#   dev -> main   OVERRIDE  (source: dev, target: main)    -- skips qa
#
# The dev -> main route exists for an urgent fix that cannot wait for a qa
# cycle. It is NOT a hole in the promotion order: it produces the single
# well-known branch name `promote/dev-to-main`, which branch-flow.yml allows
# into main *by that exact name only*. It is reachable only when the caller
# exposes a `target` input (ab does; the default caller does not, so for it
# `target` is always `auto` and behaviour is exactly the classic two hops).

on:
  workflow_call:
    inputs:
      source:
        description: "Source branch to promote from (dev or qa). Empty on push/schedule triggers."
        required: false
        default: ''
        type: string
      # 'auto' keeps the historical behaviour exactly: dev -> qa, qa -> main,
      # so callers that pass only `source` are unchanged. Setting it explicitly
      # is what makes the dev -> main override expressible.
      target:
        description: "Target branch: auto (the normal next step), qa or main."
        required: false
        default: auto
        type: string
    secrets:
      # Optional: a PAT/App token with `workflow` scope. Absent in some repos
      # (zabbix), in which case GITHUB_TOKEN is used -- see the checkout step.
      WORKFLOW_TOKEN:
        required: false

# Each job declares its own; nothing is granted by default. A called workflow
# can only narrow the caller's grant, so the caller must give at least
# contents/pull-requests/actions: write.
permissions: {}

jobs:
  # Fan the trigger out to the concrete promotion routes to run. A manual
  # dispatch yields exactly one route (honouring source/target, including the
  # dev -> main override). A scheduled run yields both normal hops. A push to
  # qa yields the dev -> qa hop only.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      routes: ${{ steps.plan.outputs.routes }}
    steps:
      - name: Resolve routes
        id: plan
        env:
          # Via env, never spliced into the script: under workflow_call these
          # are free-form strings, not the dispatch form's fixed choices.
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SRC_IN: ${{ inputs.source }}
          TGT_IN: ${{ inputs.target }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            # Both normal forward hops. dev -> main is intentionally NOT part of
            # the automatic cadence: it is the manual-only urgent override.
            routes='[{"src":"dev","tgt":"qa"},{"src":"qa","tgt":"main"}]'
            echo "Scheduled run: promoting dev -> qa and qa -> main"
          elif [ "$EVENT" = "push" ]; then
            # Pinned, NOT taken from the ref. github.ref_name on this trigger is
            # "qa", which would resolve to the qa -> main hop and auto-advance
            # production every time a promotion landed. Queueing the next
            # dev -> qa unit is the only thing this trigger may do.
            #
            # The trigger filter now lives in each repo's caller, so it is
            # re-checked here: a caller that also listened to pushes on dev
            # would recreate the per-commit cascade described in the header.
            if [ "$REF" != "qa" ]; then
              echo "::warning::push to '$REF' does not drive promotion (only a push to qa queues the next dev -> qa unit); nothing to do"
              echo "routes=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            routes='[{"src":"dev","tgt":"qa"}]'
            echo "qa advanced: preparing the next dev -> qa unit"
          else
            src="${SRC_IN:-$REF}"
            tgt_in="${TGT_IN:-auto}"

            # The normal next hop, used when target is 'auto'/absent.
            case "$src" in
              dev) auto_tgt=qa ;;
              qa)  auto_tgt=main ;;
              *)   echo "::error::$src is not a promotable branch"; exit 1 ;;
            esac

            if [ "$tgt_in" = "auto" ]; then
              tgt="$auto_tgt"
            else
              tgt="$tgt_in"
            fi

            # Allowlist the routes that may exist, rather than trusting the two
            # inputs independently. dev->main is deliberately present: it is the
            # documented override for an urgent fix that cannot wait for a qa
            # cycle. It still only opens a PR into main -- nothing here merges.
            # NB the ':' separator: a case pattern like `dev->qa` is a bash
            # SYNTAX error, because '>' is parsed as a redirection.
            case "$src:$tgt" in
              dev:qa|qa:main) ;;
              dev:main)
                echo "::warning title=Skipping qa::Promoting dev straight to main (override path). This opens a PR; it does not merge." ;;
              *)
                echo "::error::'$src -> $tgt' is not a permitted promotion route (allowed: dev->qa, qa->main, dev->main)"
                exit 1 ;;
            esac

            routes="[{\"src\":\"$src\",\"tgt\":\"$tgt\"}]"
            echo "Manual run: promoting $src -> $tgt"
          fi
          echo "routes=$routes" >> "$GITHUB_OUTPUT"

  promote:
    name: promote ${{ matrix.route.src }} -> ${{ matrix.route.tgt }}
    needs: plan
    if: needs.plan.outputs.routes != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write   # to release the promotion PR's own CI run (see last step)
    strategy:
      # Independent hops: don't cancel qa->main just because dev->qa failed.
      fail-fast: false
      matrix:
        route: ${{ fromJSON(needs.plan.outputs.routes) }}
    # Job-level, not workflow-level: workflow `concurrency` is evaluated before
    # the matrix expands. Keyed off the ROUTE actually being promoted, not the
    # ref the run was dispatched from -- a manual run is always dispatched from
    # the default branch, and a push-triggered run has ref_name 'qa' while
    # promoting dev, so the ref would put runs that force-push the SAME
    # promotion branch into different queues. The target is part of the key
    # because dev has two possible destinations (qa, and main via the
    # override). The repository is spelled out because this file is shared by
    # every repo in the fleet; the group must never be read as fleet-wide.
    concurrency:
      group: promote-${{ github.repository }}-${{ matrix.route.src }}-to-${{ matrix.route.tgt }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GitHub REFUSES to let the Actions GITHUB_TOKEN create or update any
          # file under .github/workflows/, and NO `permissions:` block can grant
          # it -- it is a platform rule, not a configurable scope. A promotion or
          # back-merge whose unit touches a workflow file therefore died at the
          # push step with "refusing to allow a GitHub App to create or update
          # workflow ... without `workflows` permission". That stalled the
          # promotion queue, and because back-merge is what keeps dev and qa
          # converged, it also let them drift until they genuinely conflicted.
          # WORKFLOW_TOKEN (a PAT or App token carrying `workflow` scope) is
          # used when it exists; the push step explains the situation instead of
          # failing opaquely when it does not.
          # CREDENTIAL SCOPE, stated explicitly. actions/checkout persists this
          # token in .git/config, so every LATER step in this job pushes with
          # `workflow` scope rather than the narrower GITHUB_TOKEN. That is
          # accepted, and it is bounded: this job's only network writes are the
          # `git push -f origin "$BR"` below and the `gh` PR calls, all aimed at
          # the single well-known promote/<src>-to-<tgt> branch. The job never
          # merges (see the header) and never pushes to dev/qa/main.
          #
          # TRIGGER BEHAVIOUR. A PAT push DOES start downstream workflows, where
          # a GITHUB_TOKEN push does not -- so this could recurse if the push
          # target were a trigger branch. It is not: the caller's
          # `on.push.branches` is `[qa]` ONLY (and `plan` refuses any other
          # pushed ref), and the branch pushed here is always promote/*, which
          # matches no trigger in promote.yml or backmerge.yml. The loop is
          # therefore closed by the trigger filter, not by the token's weakness.
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          # The default, spelled out because the push step below relies on it.
          persist-credentials: true

      - name: Resolve source and target
        id: route
        env:
          SRC: ${{ matrix.route.src }}
          TGT: ${{ matrix.route.tgt }}
        run: |
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "tgt=$TGT" >> "$GITHUB_OUTPUT"
          echo "branch=promote/$SRC-to-$TGT" >> "$GITHUB_OUTPUT"
          echo "Promoting $SRC -> $TGT"

      - name: Build promotion branch (code only; VERSION pinned to target, then advanced one step)
        id: build
        env:
          SRC: ${{ steps.route.outputs.src }}
          TGT: ${{ steps.route.outputs.tgt }}
          BR: ${{ steps.route.outputs.branch }}
          # One ORIGINAL unit of work per promotion PR instead of everything
          # that has accumulated. A 20-file batch is what drove the skeptical
          # reviewers past their file budget, so they rejected on "could not
          # verify" rather than on any real defect.
          PROMOTE_SPLIT: '1'
        run: |
          git config user.name  "promote-bot[bot]"
          git config user.email "promote-bot@users.noreply.github.com"
          bash .github/scripts/promote.sh

      - name: Push promotion branch
        if: steps.build.outputs.changed == 'true'
        env:
          BR: ${{ steps.route.outputs.branch }}
          TGT: ${{ steps.route.outputs.tgt }}
          # An unset secret is the empty string, so this is 'true' only when a
          # workflow-scoped token is actually configured.
          HAS_WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN != '' }}
        run: |
          # TGT drives the preflight diff below. If it were ever empty the diff
          # would degrade to "origin/...$BR", which FAILS -- and a failed diff
          # takes the warn-and-push branch, silently disabling the preflight.
          # Fail loudly instead: a missing route output is a bug, not a state to
          # push through. (steps.route does emit tgt; this pins that it must.)
          if [ -z "$TGT" ]; then
            echo "::error::TGT is empty -- steps.route must emit a 'tgt' output. Refusing to push without a working workflow-file preflight."
            exit 1
          fi
          # Preflight: a push carrying a .github/workflows/ change is rejected
          # outright unless the credential holds `workflow` scope. Detecting it
          # here turns an opaque git failure into an instruction.
          #
          # A diff that cannot be computed still WARNS and pushes (rather than
          # refusing, as kvm/dhcp did when no WORKFLOW_TOKEN exists): most
          # pushes carry no workflow file and would succeed, and the push-error
          # diagnosis below names the cause if this one does not. The diff's
          # own stderr is kept so the warning says WHY it failed.
          errf="${RUNNER_TEMP:-/tmp}/promote-diff.err"
          has_wf=false
          if wf="$(git diff --name-only "origin/$TGT...$BR" 2>"$errf")"; then
            if printf '%s\n' "$wf" | grep -q '^\.github/workflows/'; then
              has_wf=true
              if [ "$HAS_WORKFLOW_TOKEN" != "true" ]; then
                echo "::error::This promotion changes .github/workflows/, which the Actions GITHUB_TOKEN is forbidden to push. Add a repository secret WORKFLOW_TOKEN holding a token with 'workflow' scope, then re-run. No permissions: block can grant this -- it is a GitHub platform restriction."
                printf 'Workflow files carried by this promotion:\n%s\n' \
                  "$(printf '%s\n' "$wf" | grep '^\.github/workflows/')"
                exit 1
              fi
            fi
          else
            echo "::warning::could not diff origin/$TGT...$BR to preflight the push credential ($(tr '\n' ' ' < "$errf")); attempting the push anyway"
          fi
          # A push that still fails (expired/under-scoped WORKFLOW_TOKEN, or a
          # workflow file the failed preflight could not see) is explained
          # instead of surfacing only git's raw refusal.
          pushf="${RUNNER_TEMP:-/tmp}/promote-push.err"
          if ! git push -f -q origin "$BR" 2>"$pushf"; then
            cat "$pushf" >&2
            if [ "$has_wf" = "true" ] || grep -qi 'workflow' "$pushf"; then
              if [ "$HAS_WORKFLOW_TOKEN" = "true" ]; then
                echo "::error::Push failed while carrying .github/workflows/ changes. Verify that WORKFLOW_TOKEN carries 'workflow' scope and has not expired."
              else
                echo "::error::Push was refused for a .github/workflows/ change. Add a repository secret WORKFLOW_TOKEN holding a token with 'workflow' scope, then re-run."
              fi
            fi
            exit 1
          fi

      - name: Open or update the promotion PR
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ steps.route.outputs.src }}
          TGT: ${{ steps.route.outputs.tgt }}
          BR: ${{ steps.route.outputs.branch }}
          UNIT_PR: ${{ steps.build.outputs.unit_pr }}
          UNIT_SUBJECT: ${{ steps.build.outputs.unit_subject }}
          REMAINING: ${{ steps.build.outputs.remaining }}
        run: |
          set -e
          # NB this runs under `bash -e -o pipefail` (GitHub's default shell), so
          # every command substitution below that can legitimately fail is
          # tested with `if` or ended with `|| true` -- a bare
          # `x="$(cmd)"; if [ $? -eq 0 ]` aborts the step before the test runs,
          # and `cmd | head -N` can die of SIGPIPE on a long list.
          #
          # Name the ORIGINAL work, not just the hop -- with one unit per
          # promotion PR, "promote: dev -> qa" alone no longer identifies which
          # change is in flight. The `promote:` prefix is load-bearing:
          # fleet_guardrails.is_promotion matches on it.
          title="promote: $SRC -> $TGT"
          if [ -n "$UNIT_SUBJECT" ]; then
            if [ -n "$UNIT_PR" ]; then
              title="$title (#$UNIT_PR: $UNIT_SUBJECT)"
            else
              title="$title ($UNIT_SUBJECT)"
            fi
          fi
          # The panel is told to lower confidence when a PR states no intent
          # (AGENTS.md: Pull Request Intent & Specification Rule). A promotion
          # PR inherits its intent from the original PR it carries, so fetch
          # that and quote it. The old boilerplate ("carries code only") is
          # what made every recent promotion reject with ZERO code findings --
          # dns#65, le#22, opnsense#54, cppm#34, nw#128 all read "the
          # description doesn't match the diff".
          #
          # "intent is empty" is FOUR different states and they must not print the
          # same sentence: no originating PR at all, a fetch that FAILED (so the
          # section was never even looked at), a PR with no section, and a PR that
          # left the template comment unfilled. Reporting a failed fetch as "stated
          # no intent" is simply false, and it hides a broken token or a deleted PR.
          intent=""
          intent_state="no-unit"
          if [ -n "$UNIT_PR" ]; then
            # Pessimistic default: only a confirmed exit 0 clears it.
            intent_state="fetch-failed"
            if unit_body="$(gh pr view "$UNIT_PR" --json body -q .body 2>/dev/null)"; then
              # A heading is `#`s FOLLOWED BY WHITESPACE: a body line that merely
              # starts with an issue ref ("#123 fixed ...") must neither open nor
              # close the section. HTML comments are stripped across lines --
              # the PR template's placeholders can span several lines, and a
              # line-local `sed 's/<!--.*-->//'` left them quoted as "intent".
              if printf '%s\n' "$unit_body" \
                   | grep -E '^#+[[:space:]].*Intent & Problem Statement' >/dev/null; then
                intent="$(printf '%s\n' "$unit_body" | awk '
                  /^#+[[:space:]]/ && /Intent & Problem Statement/ { f=1; next }
                  f && /^#+[[:space:]]/ { exit }
                  f { print }' | perl -0777 -pe 's/<!--.*?-->//gs' | sed '/^[[:space:]]*$/d')"
                if [ -n "$intent" ]; then
                  intent_state="ok"
                else
                  intent_state="unfilled"
                fi
              else
                intent_state="no-section"
              fi
            fi
          fi
          base="origin/$TGT"
          # No `|| echo 0` here: that masks a rev-list FAILURE as a genuine count
          # of 0, so the body would claim "0 commit(s)" for a promotion that may
          # carry many. Capture the real status, then default only on failure.
          # (Tested inside the `if`: the `x=$(...); [ $? -eq 0 ]` spelling some
          # copies used aborts under `bash -e` before $? is ever read.)
          if ncommits="$(git rev-list --count --no-merges "$base..$BR" 2>/dev/null)" && [ -n "$ncommits" ]; then
            ncommits_ok="yes"
            commits="$(git log --no-merges --format='- `%h` %s' "$base..$BR" 2>/dev/null | head -30 || true)"
          else
            ncommits_ok="no"
            ncommits="0"
            commits=""
          fi
          # Same masking hazard as ncommits: piping into `wc -l` prints 0 when
          # the diff itself FAILED (bad ref, no merge base), so "0 file(s)"
          # would read as a truthful count of an empty promotion. Everything
          # derived from the file list is computed only when the list itself
          # was obtained, and the automation scan reuses that one list rather
          # than re-running a diff that could fail differently.
          if files_list="$(git diff --name-only "$base...$BR" 2>/dev/null)"; then
            nfiles_ok="yes"
            nfiles="$(printf '%s\n' "$files_list" | grep -c . || true)"
            files="$(git diff --numstat "$base...$BR" 2>/dev/null \
                     | awk -F'\t' 'NF && $3 != "" {printf "- `%s` (+%s/-%s)\n", $3, $1, $2}' | head -30 || true)"
            automation="$(printf '%s\n' "$files_list" \
                          | grep -E '^\.github/|\.sh$' | sed 's/^/- `/; s/$/`/' | head -20 || true)"
          else
            nfiles_ok="no"
            nfiles="0"
            files=""
            automation=""
          fi
          {
            printf '## Intent & Problem Statement\n\n'
            if [ -n "$UNIT_SUBJECT" ]; then
              printf 'Promotes **one unit of work** from `%s` into `%s`' "$SRC" "$TGT"
              if [ -n "$UNIT_PR" ]; then printf ' (originally #%s)' "$UNIT_PR"; fi
              printf ':\n\n> %s\n\n' "$UNIT_SUBJECT"
            else
              printf 'Automated promotion of `%s` into `%s`.\n\n' "$SRC" "$TGT"
            fi
            case "$intent_state" in
              ok)
                printf 'Intent carried from #%s:\n\n' "$UNIT_PR"
                printf '%s\n' "$intent" | sed 's/^/> /'
                printf '\n' ;;
              unfilled)
                printf '_#%s has an Intent section but left it unfilled, so there is\n' "$UNIT_PR"
                printf 'no stated intent to carry. What this PR actually carries is\n'
                printf 'enumerated below._\n\n' ;;
              no-section)
                printf '_#%s stated no Intent section, so there is nothing to carry.\n' "$UNIT_PR"
                printf 'What this PR actually carries is enumerated below._\n\n' ;;
              fetch-failed)
                printf '_Could not read #%s to inherit its intent (the GitHub fetch\n' "$UNIT_PR"
                printf 'failed), so the intent below is UNKNOWN -- not absent. Review\n'
                printf 'the enumerated changes directly._\n\n' ;;
              *)
                printf '_This promotion is not tied to a single originating PR, so there\n'
                printf 'is no upstream intent to inherit. What it carries is enumerated\n'
                printf 'below._\n\n' ;;
            esac
            if [ "${REMAINING:-0}" -gt 0 ] 2>/dev/null; then
              printf 'Up to **%s** further unit(s) are queued behind this one and will\n' "$REMAINING"
              printf 'be promoted once this PR merges, oldest first.\n\n'
            fi

            printf '## Proposed Solution & Changes\n\n'
            if [ "$nfiles_ok" = "yes" ]; then
              fphrase="$(printf '%s file(s)' "$nfiles")"
            else
              fphrase='an UNKNOWN number of files (`git diff` failed)'
            fi
            if [ "$ncommits_ok" = "yes" ]; then
              printf 'This is a promotion, not new work: %s commit(s) touching %s,\n' "$ncommits" "$fphrase"
              printf 'already reviewed and merged on the way into `%s`.\n\n' "$SRC"
            else
              printf 'This is a promotion, not new work, touching %s, already\n' "$fphrase"
              printf 'reviewed and merged on the way into `%s`. The commit count could\n' "$SRC"
              printf 'not be determined (`git rev-list` failed) -- it is UNKNOWN, not zero.\n\n'
            fi
            # A failed listing is stated, never rendered as an empty section.
            if [ "$ncommits_ok" != "yes" ]; then
              printf '**Commits carried:**\n\n_Could not list commits (`git rev-list` failed)._\n\n'
            elif [ -n "$commits" ]; then
              printf '**Commits carried:**\n\n%s\n\n' "$commits"
              if [ "${ncommits:-0}" -gt 30 ] 2>/dev/null; then
                printf '_...and %s more._\n\n' "$((ncommits - 30))"
              fi
            fi
            if [ "$nfiles_ok" != "yes" ]; then
              printf '**Files changed:**\n\n_Could not list changed files (`git diff` failed)._\n\n'
            elif [ -n "$files" ]; then
              printf '**Files changed:**\n\n%s\n\n' "$files"
              if [ "${nfiles:-0}" -gt 30 ] 2>/dev/null; then
                printf '_...and %s more._\n\n' "$((nfiles - 30))"
              fi
            fi

            printf '## Guardrails & Side-Effect Assessment\n\n'
            printf -- '- Every tracked `VERSION` file is pinned to `%s`'"'"'s own sequence and\n' "$TGT"
            printf '  advanced one step here; a version set on `%s` never leaks across.\n' "$SRC"
            if [ "$nfiles_ok" != "yes" ]; then
              printf -- '- Whether workflow or shell-script paths are touched is UNKNOWN\n'
              printf '  (`git diff` failed) -- do not read this as "none".\n'
            elif [ -n "$automation" ]; then
              printf -- '- This promotion changes **automation**, so it is not behaviour-neutral.\n'
              printf '  Workflow/script paths touched:\n\n%s\n' "$automation"
            else
              printf -- '- No workflow or shell-script paths are touched.\n'
            fi
            printf '\n'

            printf '## Verification & Parity\n\n'
            printf -- '- Each commit was reviewed by the skeptical panel before merging into `%s`.\n' "$SRC"
            printf -- '- Repository CI runs on this promotion PR.\n'
          } > /tmp/promote-body.md

          # GitHub's GraphQL API intermittently answers "Something went wrong
          # while executing your query", and when it does the promotion branch
          # has ALREADY been pushed -- so the step fails with no PR, and the
          # promotion stalls silently until the next run. ab's own dev->qa
          # promotion died exactly this way (run 36516057861).
          #
          # NB "$@", never eval: $title is a commit subject, i.e. arbitrary text
          # that can contain backticks, $(...) and semicolons. Building a command
          # string from it and eval-ing would be a command-injection hole.
          # stderr is deliberately NOT suppressed, so the real gh error still
          # reaches the job log.
          gh_retry() {
            local _attempt=1
            local _delay=3
            while : ; do
              if "$@"; then
                return 0
              fi
              if [ "$_attempt" -ge 5 ]; then
                return 1
              fi
              echo "gh call failed (attempt $_attempt/5); retrying in ${_delay}s..." >&2
              sleep "$_delay"
              _attempt=$((_attempt + 1))
              _delay=$((_delay * 2))
            done
          }
          find_existing() {
            gh_retry gh pr list --head "$BR" --base "$TGT" --state open --json number -q '.[0].number'
          }
          # `|| true`: a failing command substitution would abort under `bash -e`
          # before the create path below can handle it.
          existing=$(find_existing || true)
          if [ -n "$existing" ]; then
            # Title and body are both REBUILT every run, including when the PR
            # already exists. The promotion branch is force-pushed as the queue
            # advances, so a description written once at open time goes stale
            # immediately -- it can name a unit that is no longer the one in
            # flight, and skeptical reviewers read that as an intent-vs-diff
            # mismatch and hold the PR. (kvm's copy had stopped refreshing; that
            # reintroduced exactly this, so it is not carried here.)
            echo "PR #$existing already open for $BR -- refreshing its title and body."
            gh_retry gh pr edit "$existing" --title "$title" --body-file /tmp/promote-body.md
            exit 0
          fi
          # Deliberately NOT under gh_retry, and deliberately tested with `if !`
          # rather than `$?` (which `bash -e` never reaches): a create that
          # succeeded server-side but returned a transport error would be
          # created TWICE by a blind retry. Re-check instead.
          if ! gh pr create --base "$TGT" --head "$BR" \
            --title "$title" \
            --body-file /tmp/promote-body.md; then
            sleep 5
            existing=$(find_existing || true)
            if [ -n "$existing" ]; then
              echo "PR creation reported an error, but PR #$existing exists -- the create landed."
              exit 0
            fi
            echo "::error::gh pr create failed and no PR exists for $BR. The promotion branch was pushed, so re-running this workflow will open the PR."
            exit 1
          fi

      # A PR opened with GITHUB_TOKEN does not start its checks automatically --
      # GitHub parks the run as `action_required`. On a repo that requires CI on
      # qa/main that is a DEADLOCK: the required check can never report, so the
      # promotion PR sits MERGEABLE/BLOCKED forever. Releasing the parked run
      # here keeps the pipeline hands-free. (Relaxing the fork-PR approval
      # policy does NOT fix this -- verified; it is the bot-authored PR that is
      # gated, not an untrusted contributor.)
      - name: Release the promotion PR's CI run
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BR: ${{ steps.route.outputs.branch }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          # More than one workflow is triggered per PR (CI *and* branch-flow),
          # and they do not enter `action_required` at the same instant. The
          # first version of this loop returned as soon as ANY parked run was
          # approved, so whichever workflow parked a second later stayed parked
          # -- and if that one was `CI`, the required `test` check never
          # reported and the PR was BLOCKED forever ("Required status check
          # \"test\" is expected", ab#338). Keep polling and approve every run
          # we have not already approved, for the full bounded window (24 polls,
          # ~2 min) so a late-parking run is still reached.
          #
          # There is deliberately NO quiet-period early exit. Most copies broke
          # out after three polls without a new approval, which is ~15 s -- a
          # workflow parking later than that was never seen, i.e. ab#338 again
          # (lm 9378efb3 removed it for that reason). The fixed ~2 min costs
          # less than a permanently blocked PR.
          #
          # `approved` means RELEASED: an id is recorded only when the approve
          # POST actually succeeded. Recording a failed approval as a success
          # made the run un-retryable (the dedupe guard swallowed it) and
          # printed "released" for a run that was still parked. A failed attempt
          # is remembered in `failed_ever` and reported at the end unless a later
          # poll released it.
          #
          # A FAILED LISTING IS NOT AN EMPTY QUEUE. A listing failure (bad or
          # expired token, missing `actions` scope, rate limit, 5xx) is retried
          # on the next poll; if the LAST listing failed, the queue is reported
          # as UNKNOWN rather than "no parked run found". (A failure followed
          # by a successful poll is harmless: parked runs stay parked, so the
          # later poll saw them.)
          approved=""
          failed_ever=""
          list_failures=0
          last_list_ok=0
          for _ in $(seq 1 24); do
            if ids=$(gh api "repos/$REPO/actions/runs?branch=$BR&status=action_required" \
                       --jq ".workflow_runs[] | select(.head_sha == \"$SHA\") | .id" 2>/dev/null); then
              last_list_ok=1
            else
              ids=""
              last_list_ok=0
              list_failures=$((list_failures + 1))
              echo "::warning::could not list parked runs for $BR @ $SHA -- will retry on the next poll"
            fi
            for id in $ids; do
              case " $approved " in *" $id "*) continue ;; esac
              echo "approving parked run $id"
              if gh api -X POST "repos/$REPO/actions/runs/$id/approve"; then
                approved="$approved $id"
              else
                echo "::warning::could not approve run $id -- will retry on the next poll"
                case " $failed_ever " in *" $id "*) ;; *) failed_ever="$failed_ever $id" ;; esac
              fi
            done
            sleep 5
          done
          outstanding=""
          for id in $failed_ever; do
            case " $approved " in *" $id "*) continue ;; esac
            outstanding="$outstanding $id"
          done
          if [ -n "$approved" ]; then
            echo "::notice::released parked run(s):$approved"
          elif [ -z "$outstanding" ] && [ "$last_list_ok" = "1" ]; then
            echo "::notice::no parked run found for $BR @ $SHA"
          fi
          if [ "$last_list_ok" != "1" ]; then
            echo "::warning::the final attempt to list parked runs for $BR @ $SHA FAILED ($list_failures failure(s) in total), so the parked queue is UNKNOWN, not known-empty -- check the token's 'actions' scope and approve any parked run by hand"
          fi
          if [ -n "$outstanding" ]; then
            echo "::warning::could NOT release parked run(s):$outstanding -- approve them by hand to unblock this PR"
          fi
