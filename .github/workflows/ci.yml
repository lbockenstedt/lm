name: CI

# Gates the dev -> qa -> main promotion flow. `qa` and `main` require a PR, so
# without a status check those gates would verify nothing. This job is that
# check. `dev` also runs on direct push, which contributors are allowed to make.

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, qa, dev ]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first (about 20 s): fleet rules, new ruff errors, twin files.
  # `test` waits for them, so a rule violation fails the run before the
  # expensive install and test steps start. Dev only: promotion PRs into
  # qa/main carry commits that already passed here, so `test` runs alone.
  checks:
    if: (github.event_name == 'push' && github.ref_name == 'dev') || github.base_ref == 'dev'
    permissions:
      contents: read
    uses: ./.github/workflows/fleet-rules-reusable.yml

  test:
    needs: checks
    # Run when checks passed or were skipped (qa/main PRs). A failed `checks`
    # still starts `test` so it can FAIL in the first step: a skipped required
    # check would count as passing on a protected branch.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop early when the fast checks failed
        if: needs.checks.result == 'failure'
        run: |
          echo "::error::Fleet checks failed; see the 'checks' job. Tests not run."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
          # Requirements are NOT always at the repo root -- several repos declare
          # them per component (lm-spoke/, agent/, core/ ...). Installing only a
          # root requirements.txt silently left fastapi/httpx/websockets missing
          # and every test module failed to import. Install all of them.
          # Non-fatal: a transient index failure must not gate the merge; a
          # genuinely missing import still fails the test step below.
          while IFS= read -r req; do
            echo "installing $req"
            pip install -r "$req" || true
          done < <(find . -name 'requirements*.txt' \
                     -not -path './_lm/*' -not -path '*/venv/*' \
                     -not -path '*/node_modules/*' | sort)
      - name: WebUI JavaScript syntax check
        # A single stray brace in one WebUI script blanks the whole page, and
        # the browser smoke test reports that only as a missing view. node
        # --check fails fast and names the file and line. Vendored minified
        # bundles under WebUI/assets are third-party and skipped.
        run: |
          set -e
          find WebUI -name '*.js' -not -path 'WebUI/assets/*' \
               -not -path '*/node_modules/*' -not -name '*.min.js' -print0 |
            xargs -0 -n1 node --check
      - name: Workflow and promotion script tests
        # Cheap, so they run before the browser install: the promotion docs
        # test and the VERSION-pinning self-test for .github/scripts/promote.sh.
        run: |
          pytest -q .github/tests
          bash .github/scripts/promotion_selftest.sh
      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-${{ runner.os }}
      - name: Install browser for the WebUI smoke test
        # CI only -- the fleet never installs this. core/tests/
        # test_webui_browser_smoke.py walks every WebUI view in headless
        # Chromium and must run here (it only skips when CI is unset).
        # The browser comes from the cache when it hits; the system libraries
        # it needs are always installed.
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Run tests
        # One pytest process PER COMPONENT, not one for all of them.
        #
        # Each component's conftest puts its own src/ on sys.path and imports
        # those modules as top-level, and the components share module names —
        # agent/src/control_plane.py and henet/src/control_plane.py both want to
        # be `control_plane`, and core/src/security collides likewise. In a
        # single process whichever component imports first wins for everyone,
        # so agent/tests died with "cannot import name 'AgentControlPlane' from
        # 'control_plane' (henet/src/control_plane.py)" — a collection error
        # that aborted the run before any test executed.
        #
        # They are separate applications that happen to share a repo and DO run
        # as separate processes in production, so give them separate processes
        # here too. Run them all even after one fails, so a single red component
        # does not hide the state of the others.
        run: |
          set -u
          failed=""
          for c in agent console core dhcp dns henet proxy; do
            echo "::group::$c"
            pytest --timeout=300 --timeout-method=thread -q "$c/tests" || failed="$failed $c"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing components:$failed"
            exit 1
          fi
