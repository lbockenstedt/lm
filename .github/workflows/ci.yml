name: CI

# Gates the dev -> qa -> main promotion flow. `qa` and `main` require a PR, so
# without a status check those gates would verify nothing. This job is that
# check. `dev` also runs on direct push, which contributors are allowed to make.

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, qa, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Requirements are NOT always at the repo root -- several repos declare
          # them per component (lm-spoke/, agent/, core/ ...). Installing only a
          # root requirements.txt silently left fastapi/httpx/websockets missing
          # and every test module failed to import. Install all of them.
          # Non-fatal: a transient index failure must not gate the merge; a
          # genuinely missing import still fails the test step below.
          while IFS= read -r req; do
            echo "installing $req"
            pip install -r "$req" || true
          done < <(find . -name 'requirements*.txt' \
                     -not -path './_lm/*' -not -path '*/venv/*' \
                     -not -path '*/node_modules/*' | sort)
      - name: Run tests
        # One pytest process PER COMPONENT, not one for all five.
        #
        # Each component's conftest puts its own src/ on sys.path and imports
        # those modules as top-level, and the components share module names —
        # agent/src/control_plane.py and henet/src/control_plane.py both want to
        # be `control_plane`, and core/src/security collides likewise. In a
        # single process whichever component imports first wins for everyone,
        # so agent/tests died with "cannot import name 'AgentControlPlane' from
        # 'control_plane' (henet/src/control_plane.py)" — a collection error
        # that aborted the run before any test executed.
        #
        # They are separate applications that happen to share a repo and DO run
        # as separate processes in production, so give them separate processes
        # here too. Run all five even after one fails, so a single red component
        # does not hide the state of the other four.
        run: |
          set -u
          failed=""
          for c in agent console core henet proxy; do
            echo "::group::$c"
            pytest -q "$c/tests" || failed="$failed $c"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing components:$failed"
            exit 1
          fi
