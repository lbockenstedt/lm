name: backmerge (reusable)

# Keeps qa and dev from falling permanently behind the branches above them.
#
# REUSABLE. This is the single fleet copy of backmerge.yml's logic. Each repo
# keeps a thin `.github/workflows/backmerge.yml` that owns the trigger
# (`on: push: branches: [main, qa]`) and the token `permissions`, and calls
# this with `secrets: inherit` (template:
# .github/workflow-templates-fleet/backmerge.yml). In a called workflow
# `github.ref_name`, `github.repository` and the checked-out repo are the
# CALLER's, so the per-push pair filtering below works exactly as it did inline.
#
# WHY THIS EXISTS
# The promotion flow is one-way: dev -> qa -> main. Anything that lands on an
# UPPER branch without travelling that path therefore leaves the lower ones
# behind, and the gap never closes on its own. Three things routinely do
# exactly that:
#
#   * the repo owner committing directly to main (the one path allowed to skip
#     the flow -- see branch-flow.yml),
#   * the promotion merge commits themselves. `promote/qa-to-main` is merged
#     INTO main, so main gains a merge commit plus its VERSION bump that qa
#     never sees. This is not hypothetical: ab's main was 4 commits ahead of qa
#     from promotions alone before this workflow existed, and
#   * FIXES MADE DURING A PROMOTION. A promotion PR is a real PR: it gets
#     reviewed, and when the panel (or a human) finds something, the repair is
#     committed onto the promotion branch -- `promote/dev-to-qa` for a qa
#     promotion, `promote/qa-to-main` for a main one. That repair therefore
#     exists ONLY on the branch being promoted into. The `promote/qa-to-main`
#     case is carried back by main -> dev below; the `promote/dev-to-qa` case
#     lands on qa, and before qa was made a source here NOTHING carried it back
#     to dev. dev would then re-promote the unfixed code and the same defect
#     would be found again, every cycle, forever.
#
# Left alone the divergence compounds, and the next promotion PR carries a
# confusing diff full of changes that are "already on main".
#
# WHAT IT DOES
# On every push to main it opens main -> qa and main -> dev; on every push to
# qa it opens qa -> dev. Each PR is merged as soon as its required checks pass
# (natively via auto-merge on qa, which is check-gated; after waiting for the
# checks to go green on dev, which is not). It never pushes to qa or dev
# directly: those branches take changes by pull request like everything else,
# so a conflicting or failing back-merge surfaces for a human instead of being
# force-resolved by a bot.
#
# NO LOOP, and this is the property to preserve when editing:
#   * Nothing here ever writes to main, so a push to main cannot re-trigger the
#     workflow (pinned by test_never_writes_to_main).
#   * The back-merge graph is strictly DOWNWARD -- main -> {qa,dev}, qa -> dev.
#     dev is never a source, so it is a terminal node. The longest possible
#     chain is main -> qa -> dev and then it stops.
#   * In practice even that chain does not fire for a BACK-MERGE: a back-merge
#     into qa is merged with GITHUB_TOKEN, which does not spawn new workflow
#     runs, and main -> dev is opened in parallel anyway. A promotion PR into
#     qa (or a direct push to qa) is landed by a human, so THAT push does run
#     qa -> dev -- as intended: it is how a fix made on promote/dev-to-qa gets
#     back to dev. (If the merge calls below were ever switched from
#     GITHUB_TOKEN to a PAT, a back-merge into qa would also trigger qa -> dev;
#     still bounded, because dev is terminal.)
# Do not add dev as a source, and do not add main as a target.
#
# VERSION is handled by the same .github/scripts/promote.sh used by promote.yml
# -- shared deliberately, because the VERSION pinning and conflict handling are
# the fiddly part and a second copy would drift. Back-merge carries code only:
# every tracked VERSION file is pinned to the TARGET's value and then advanced
# one step, so qa/dev keep their own version lineage; an upper branch's version
# never leaks backwards.

on:
  workflow_call:
    secrets:
      # Optional: a PAT/App token with `workflow` scope. Absent in some repos
      # (zabbix), in which case GITHUB_TOKEN is used -- see the checkout step.
      WORKFLOW_TOKEN:
        required: false

# Granted per job. A called workflow can only narrow the caller's grant, so the
# caller must give at least contents/pull-requests/actions: write.
permissions: {}

jobs:
  backmerge:
    name: backmerge ${{ matrix.source }} -> ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write   # to release the back-merge PR's own parked CI run
    # Job-level, not workflow-level: workflow `concurrency` is evaluated before
    # the matrix expands, so `matrix.source` and `matrix.target` are empty there
    # and every pair would collapse into one queue (the qa run cancelling the
    # dev run). The repository is spelled out because this file is shared by
    # every repo in the fleet; the group must never be read as fleet-wide.
    concurrency:
      group: backmerge-${{ github.repository }}-${{ matrix.source }}-to-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false   # other targets must still be offered the change if one conflicts
      # Every DOWNWARD edge of the promotion graph. `include` rather than two
      # crossed lists because main -> qa, main -> dev and qa -> dev are the only
      # legal pairs: the cross product would also produce qa -> qa and the
      # upward edges this workflow must never take.
      #
      # Only the pairs whose source is the branch that was just pushed actually
      # do anything -- the rest are skipped by the first step. They are not
      # filtered out with a job-level `if` because the `matrix` context is NOT
      # available there (GitHub evaluates it before the matrix expands), so the
      # filter has to be a step.
      matrix:
        include:
          - source: main
            target: qa
          - source: main
            target: dev
          - source: qa
            target: dev
    steps:
      # First, and before the checkout: a non-applying pair used to do a full
      # `fetch-depth: 0` clone just to discover it had nothing to do. Values go
      # through env rather than being spliced into the script.
      - name: Skip pairs that do not apply to this push
        id: filter
        env:
          SRC: ${{ matrix.source }}
          TGT: ${{ matrix.target }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$SRC" != "$REF" ]; then
            echo "::notice::push was to '$REF'; the $SRC -> $TGT back-merge does not apply"
            echo "applies=false" >> "$GITHUB_OUTPUT"
          else
            echo "applies=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.applies == 'true'
        with:
          fetch-depth: 0
          # GitHub REFUSES to let the Actions GITHUB_TOKEN create or update any
          # file under .github/workflows/, and NO `permissions:` block can grant
          # it -- it is a platform rule, not a configurable scope. A promotion or
          # back-merge whose unit touches a workflow file therefore died at the
          # push step with "refusing to allow a GitHub App to create or update
          # workflow ... without `workflows` permission". That stalled the
          # promotion queue, and because back-merge is what keeps dev and qa
          # converged, it also let them drift until they genuinely conflicted.
          # WORKFLOW_TOKEN (a PAT or App token carrying `workflow` scope) is
          # used when it exists; the push step explains the situation instead of
          # failing opaquely when it does not.
          # CREDENTIAL SCOPE / TRIGGER BEHAVIOUR -- see the same note in
          # promote-reusable.yml. actions/checkout persists this token for every
          # later step in the job, and a PAT push (unlike a GITHUB_TOKEN push)
          # does start downstream workflows. Bounded the same way: the caller's
          # `on.push.branches` is `[main, qa]`, while every push below targets a
          # backmerge/<src>-to-<tgt> branch, which matches no trigger here or in
          # promote.yml. The later merge step uses GITHUB_TOKEN (GH_TOKEN), not
          # this credential, so the merge itself starts nothing either.
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Skip a missing target
        id: exists
        if: steps.filter.outputs.applies == 'true'
        env:
          TGT: ${{ matrix.target }}
        run: |
          if git rev-parse --verify "origin/$TGT" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no '$TGT' branch in this repo; nothing to back-merge"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build back-merge branch (code only; VERSION pinned to target, then advanced one step)
        id: build
        if: steps.filter.outputs.applies == 'true' && steps.exists.outputs.ok == 'true'
        env:
          SRC: ${{ matrix.source }}
          TGT: ${{ matrix.target }}
          BR: backmerge/${{ matrix.source }}-to-${{ matrix.target }}
          LABEL: backmerge
        run: |
          git config user.name  "promote-bot[bot]"
          git config user.email "promote-bot@users.noreply.github.com"
          bash .github/scripts/promote.sh

      - name: Push back-merge branch
        if: steps.build.outputs.changed == 'true'
        env:
          BR: backmerge/${{ matrix.source }}-to-${{ matrix.target }}
          SRC: ${{ matrix.source }}
          TGT: ${{ matrix.target }}
          HAS_WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN != '' }}
        run: |
          # A failed diff takes the warn-and-push branch below, so an empty TGT
          # would silently disable the preflight. Fail loudly instead.
          if [ -z "$TGT" ]; then
            echo "::error::TGT is empty -- the matrix must supply a target. Refusing to push without a working workflow-file preflight."
            exit 1
          fi
          # Same preflight, diff-error reporting and push-error diagnosis as
          # promote-reusable.yml -- see the checkout step above.
          errf="${RUNNER_TEMP:-/tmp}/backmerge-diff.err"
          has_wf=false
          if wf="$(git diff --name-only "origin/$TGT...$BR" 2>"$errf")"; then
            if printf '%s\n' "$wf" | grep -q '^\.github/workflows/'; then
              has_wf=true
              if [ "$HAS_WORKFLOW_TOKEN" != "true" ]; then
                echo "::error::This back-merge changes .github/workflows/, which the Actions GITHUB_TOKEN is forbidden to push. Add a repository secret WORKFLOW_TOKEN holding a token with 'workflow' scope, then re-run. Leaving this unresolved lets $SRC and $TGT drift until they conflict."
                printf 'Workflow files carried by this back-merge:\n%s\n' \
                  "$(printf '%s\n' "$wf" | grep '^\.github/workflows/')"
                exit 1
              fi
            fi
          else
            echo "::warning::could not diff origin/$TGT...$BR to preflight the push credential ($(tr '\n' ' ' < "$errf")); attempting the push anyway"
          fi
          pushf="${RUNNER_TEMP:-/tmp}/backmerge-push.err"
          if ! git push -f -q origin "$BR" 2>"$pushf"; then
            cat "$pushf" >&2
            if [ "$has_wf" = "true" ] || grep -qi 'workflow' "$pushf"; then
              if [ "$HAS_WORKFLOW_TOKEN" = "true" ]; then
                echo "::error::Push failed while carrying .github/workflows/ changes. Verify that WORKFLOW_TOKEN carries 'workflow' scope and has not expired."
              else
                echo "::error::Push was refused for a .github/workflows/ change. Add a repository secret WORKFLOW_TOKEN holding a token with 'workflow' scope, then re-run. Leaving this unresolved lets $SRC and $TGT drift until they conflict."
              fi
            fi
            exit 1
          fi

      - name: Open or update the back-merge PR
        id: pr
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ${{ matrix.source }}
          TGT: ${{ matrix.target }}
          BR: backmerge/${{ matrix.source }}-to-${{ matrix.target }}
        run: |
          set -e
          # Same GraphQL-flake hardening as promote-reusable.yml (ab run
          # 36516057861): list/lookup calls are retried with backoff, the create
          # is NOT blindly retried (a create that landed server-side but
          # returned a transport error would open a duplicate) -- it is
          # re-checked instead. "$@", never eval.
          gh_retry() {
            local _attempt=1
            local _delay=3
            while : ; do
              if "$@"; then
                return 0
              fi
              if [ "$_attempt" -ge 5 ]; then
                return 1
              fi
              echo "gh call failed (attempt $_attempt/5); retrying in ${_delay}s..." >&2
              sleep "$_delay"
              _attempt=$((_attempt + 1))
              _delay=$((_delay * 2))
            done
          }
          find_existing() {
            gh_retry gh pr list --head "$BR" --base "$TGT" --state open --json number -q '.[0].number'
          }
          existing=$(find_existing || true)
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BR (force-pushed with the latest $SRC)."
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            printf 'Automated back-merge of `%s` into `%s`.\n\n' "$SRC" "$TGT"
            printf 'Opened because `%s` moved without coming through the promotion\n' "$SRC"
            printf 'flow -- a direct commit, the merge commit from a promotion PR, or a\n'
            printf 'fix committed onto a promotion branch while that promotion was being\n'
            printf 'reviewed. That last one only ever exists on `%s`: without this PR,\n' "$SRC"
            printf '`%s` would re-promote the unfixed code and the same defect would be\n' "$TGT"
            printf 'found again next cycle.\n\n'
            printf 'Carries **code only** -- every tracked `VERSION` file is pinned to\n'
            printf '`%s`'"'"'s own sequence, so `%s`'"'"'s version does not leak backwards,\n' "$TGT" "$SRC"
            printf 'and then advanced one step. A `VERSION` change in this diff is\n'
            printf 'therefore expected: it is `%s`'"'"'s own counter moving forward, not\n' "$TGT"
            printf '`%s`'"'"'s value crossing over.\n\n' "$SRC"
            printf 'This PR merges itself once its required checks pass. If it cannot\n'
            printf '(a conflict, or a failing check) it stays open for a human -- nothing\n'
            printf 'is force-resolved and nothing is pushed to `%s` directly.\n' "$TGT"
          } > /tmp/backmerge-body.md
          if ! gh pr create --base "$TGT" --head "$BR" \
            --title "backmerge: $SRC -> $TGT" \
            --body-file /tmp/backmerge-body.md; then
            sleep 5
            existing=$(find_existing || true)
            if [ -z "$existing" ]; then
              echo "::error::gh pr create failed and no PR exists for $BR. The back-merge branch was pushed, so re-running this workflow will open the PR."
              exit 1
            fi
            echo "PR creation reported an error, but PR #$existing exists -- the create landed."
          fi
          num=$(find_existing || true)
          echo "number=$num" >> "$GITHUB_OUTPUT"

      # A PR opened with GITHUB_TOKEN does not start its checks automatically --
      # GitHub parks the run as `action_required`. qa requires check-direction,
      # so without this the back-merge PR sits BLOCKED forever. Same reasoning
      # and same fix as promote-reusable.yml's final step.
      - name: Release the back-merge PR's CI run
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BR: backmerge/${{ matrix.source }}-to-${{ matrix.target }}
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          # IDENTICAL loop to promote-reusable.yml's, deliberately -- they solve
          # the same problem and drift between them is how one silently
          # regresses. See that step for the full rationale: several workflows
          # park per PR at slightly different instants, so the loop polls for
          # the whole bounded window (24 polls, ~2 min) with NO quiet-period
          # early exit; only a SUCCESSFUL approve records a run as released, a
          # failed one is retried and reported; a failed listing is UNKNOWN,
          # not empty.
          approved=""
          failed_ever=""
          list_failures=0
          last_list_ok=0
          for _ in $(seq 1 24); do
            if ids=$(gh api "repos/$REPO/actions/runs?branch=$BR&status=action_required" \
                       --jq ".workflow_runs[] | select(.head_sha == \"$SHA\") | .id" 2>/dev/null); then
              last_list_ok=1
            else
              ids=""
              last_list_ok=0
              list_failures=$((list_failures + 1))
              echo "::warning::could not list parked runs for $BR @ $SHA -- will retry on the next poll"
            fi
            for id in $ids; do
              case " $approved " in *" $id "*) continue ;; esac
              echo "approving parked run $id"
              if gh api -X POST "repos/$REPO/actions/runs/$id/approve"; then
                approved="$approved $id"
              else
                echo "::warning::could not approve run $id -- will retry on the next poll"
                case " $failed_ever " in *" $id "*) ;; *) failed_ever="$failed_ever $id" ;; esac
              fi
            done
            sleep 5
          done
          outstanding=""
          for id in $failed_ever; do
            case " $approved " in *" $id "*) continue ;; esac
            outstanding="$outstanding $id"
          done
          if [ -n "$approved" ]; then
            echo "::notice::released parked run(s):$approved"
          elif [ -z "$outstanding" ] && [ "$last_list_ok" = "1" ]; then
            echo "::notice::no parked run found for $BR @ $SHA"
          fi
          if [ "$last_list_ok" != "1" ]; then
            echo "::warning::the final attempt to list parked runs for $BR @ $SHA FAILED ($list_failures failure(s) in total), so the parked queue is UNKNOWN, not known-empty -- check the token's 'actions' scope and approve any parked run by hand"
          fi
          if [ -n "$outstanding" ]; then
            echo "::warning::could NOT release parked run(s):$outstanding -- approve them by hand to unblock this PR"
          fi

      # Merge it. The gap only actually closes when the PR lands, and a queue
      # of stale back-merge PRs waiting on a human is the same divergence this
      # workflow exists to prevent -- just with extra steps.
      #
      # Two paths, because the targets are protected differently:
      #   * qa requires `test` + `check-direction`, so the PR is BLOCKED on
      #     open. GitHub's native auto-merge is exactly right: it lands the PR
      #     if and when those checks pass, and never if they fail.
      #   * dev has no required checks, so the PR is mergeable immediately and
      #     GitHub REFUSES to arm auto-merge ("Pull request is in clean
      #     status"). Falling straight through to a merge would land it while
      #     its checks were still running, so wait for them first and merge
      #     only on a green (or genuinely check-free) result.
      #
      # Neither path can force a conflicted merge: `gh pr merge` fails on a
      # dirty PR and it stays open for a human, which is the whole point.
      #
      # Still no loop: this pushes to qa or dev. dev back-merges from nothing,
      # and the qa -> dev edge is strictly downward, so the chain terminates.
      - name: Merge the back-merge PR
        if: steps.build.outputs.changed == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.pr.outputs.number }}
          TGT: ${{ matrix.target }}
        run: |
          if gh pr merge "$NUM" --auto --merge --delete-branch 2>/tmp/automerge.err; then
            echo "::notice::auto-merge armed on #$NUM; it will land when its checks pass"
            exit 0
          fi
          echo "auto-merge not armed: $(cat /tmp/automerge.err)"

          # Wait for the checks to settle before merging by hand. Merging is
          # reached ONLY through `settled=true`: running out of polls with
          # checks still pending used to fall through to the merge and land
          # the PR on unfinished checks.
          #
          # Per-check state: a CheckRun's `conclusion` is EMPTY until it
          # completes (gh returns "", which jq's `//` does not skip), so fall
          # back to its `status` then; a commit StatusContext has neither and
          # reports `state` (SUCCESS/PENDING/FAILURE/ERROR/EXPECTED).
          settled=false
          empty_count=0
          for _ in $(seq 1 60); do
            state=$(gh pr view "$NUM" --json state -q .state 2>/dev/null || true)
            if [ "$state" = "MERGED" ]; then
              echo "::notice::#$NUM already merged"; exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "::warning::#$NUM was closed without merging"; exit 0
            fi
            if [ -z "$state" ]; then
              # A failed lookup is not a verdict; poll again.
              sleep 10; continue
            fi
            if ! rollup=$(gh pr view "$NUM" --json statusCheckRollup \
                       -q '[.statusCheckRollup[]? | if (.conclusion // "") != "" then .conclusion elif (.status // "") != "" then .status else (.state // "UNKNOWN") end] | join(",")' 2>/dev/null); then
              sleep 10; continue
            fi
            case "$rollup" in
              "")
                # No check registered YET is the normal state seconds after a
                # PR opens. Give it a minute before calling the PR check-free.
                empty_count=$((empty_count + 1))
                if [ "$empty_count" -ge 6 ]; then
                  echo "::notice::#$NUM has no checks after waiting; treating as check-free"
                  settled=true
                  break
                fi
                sleep 10; continue ;;
              *IN_PROGRESS*|*QUEUED*|*PENDING*|*WAITING*|*REQUESTED*|*EXPECTED*)
                empty_count=0
                sleep 10; continue ;;
              *ACTION_REQUIRED*)
                echo "::warning::#$NUM has parked/unapproved checks ($rollup); leaving it open for a human"
                exit 0 ;;
              *FAILURE*|*TIMED_OUT*|*CANCELLED*|*STARTUP_FAILURE*|*STALE*|*ERROR*)
                echo "::warning::#$NUM has failing checks ($rollup); leaving it open for a human"
                exit 0 ;;
              *)
                # Merge only on states known to be green; anything unrecognised
                # (including UNKNOWN) is a human's call, not a merge.
                unknown=$(printf '%s\n' "$rollup" | tr ',' '\n' | grep -v -E '^(SUCCESS|NEUTRAL|SKIPPED)$' | paste -sd, - || true)
                if [ -n "$unknown" ]; then
                  echo "::warning::#$NUM has unrecognised check status ($unknown); leaving it open for a human"
                  exit 0
                fi
                settled=true
                break ;;
            esac
          done

          if [ "$settled" != "true" ]; then
            echo "::warning::timed out waiting for checks on #$NUM; leaving it open for a human"
            exit 0
          fi

          if gh pr merge "$NUM" --merge --delete-branch; then
            echo "::notice::merged #$NUM into $TGT"
          else
            echo "::warning::could not merge #$NUM (conflict?); it stays open for a human"
          fi
